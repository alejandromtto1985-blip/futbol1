<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Equipos de Fútbol</title>

<style>
body{
    font-family: Arial, sans-serif;
    margin:20px;
    background:#f4f4f4;
}

h1{
    text-align:center;
}

.card{
    background:white;
    padding:15px;
    border-radius:10px;
    margin-bottom:15px;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

input, select{
    width:100%;
    padding:8px;
    margin-top:5px;
    margin-bottom:10px;
}

button{
    width:100%;
    padding:10px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    margin-top:5px;
}

.add{
    background:#28a745;
    color:white;
}

.generate{
    background:#007bff;
    color:white;
}

.delete{
    background:#dc3545;
    color:white;
}

.player{
    border-bottom:1px solid #ddd;
    padding:10px 0;
}

.team{
    background:white;
    padding:15px;
    border-radius:10px;
    margin-top:15px;
}
</style>
</head>
<body>

<h1>⚽ Equipos de Fútbol</h1>

<div class="card">
    <h3>Añadir jugador</h3>

    <input type="text" id="nombre" placeholder="Nombre">

    <input type="number" id="nivel" min="1" max="5" step="0.1" placeholder="Nivel">

    <input type="text" id="pos1" placeholder="Posición principal">

    <input type="text" id="pos2" placeholder="Posición secundaria">

    <button class="add" onclick="agregarJugador()">Añadir jugador</button>
</div>

<div class="card">
    <h3>Jugadores</h3>
    <div id="listaJugadores"></div>

    <button class="generate" onclick="crearEquipos()">
        Generar equipos equilibrados
    </button>
</div>

<div id="resultado"></div>

<script>

let jugadores = JSON.parse(localStorage.getItem("jugadores")) || [];

function guardar(){
    localStorage.setItem("jugadores", JSON.stringify(jugadores));
}

function agregarJugador(){

    const nombre = document.getElementById("nombre").value;
    const nivel = parseFloat(document.getElementById("nivel").value);
    const pos1 = document.getElementById("pos1").value;
    const pos2 = document.getElementById("pos2").value;

    if(!nombre || !nivel) return;

    jugadores.push({
        nombre,
        nivel,
        pos1,
        pos2
    });

    guardar();
    mostrarJugadores();

    document.getElementById("nombre").value="";
    document.getElementById("nivel").value="";
    document.getElementById("pos1").value="";
    document.getElementById("pos2").value="";
}

function borrarJugador(i){
    jugadores.splice(i,1);
    guardar();
    mostrarJugadores();
}

function mostrarJugadores(){

    let html="";

    jugadores.forEach((j,i)=>{

        html += `
        <div class="player">
            <b>${j.nombre}</b> (${j.nivel})
            <br>
            ${j.pos1} / ${j.pos2}
            <button class="delete" onclick="borrarJugador(${i})">
                Borrar
            </button>
        </div>
        `;
    });

    document.getElementById("listaJugadores").innerHTML = html;
}

function crearEquipos(){

    let lista = [...jugadores];

    lista.sort((a,b)=>b.nivel-a.nivel);

    let equipoA=[];
    let equipoB=[];

    let puntosA=0;
    let puntosB=0;

    lista.forEach(j=>{

        if(puntosA<=puntosB){
            equipoA.push(j);
            puntosA+=j.nivel;
        }else{
            equipoB.push(j);
            puntosB+=j.nivel;
        }
    });

    let html=`
    <div class="team">
        <h2>Equipo A (${puntosA.toFixed(1)})</h2>
        ${equipoA.map(j=>`${j.nombre} (${j.nivel})`).join("<br>")}
    </div>

    <div class="team">
        <h2>Equipo B (${puntosB.toFixed(1)})</h2>
        ${equipoB.map(j=>`${j.nombre} (${j.nivel})`).join("<br>")}
    </div>
    `;

    document.getElementById("resultado").innerHTML = html;
}

mostrarJugadores();

</script>

</body>
</html>
